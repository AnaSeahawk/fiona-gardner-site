  <style>
  /* full-width black band, so it looks as it did on the original all-black test page */
  #blood-plasma{max-width:none;background:#000;padding-inline:0}
  #blood-plasma h2{color:#e9e2d6;width:100%;max-width:72rem;margin-inline:auto;padding-inline:1.25rem;box-sizing:border-box}

  #blood-plasma .collage{
    position:relative;width:100%;max-width:1600px;margin:0 auto;
    aspect-ratio:16/9;display:grid;gap:6px;background:#000;
    grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
  }
  #blood-plasma .bp-tile{position:relative;overflow:hidden;background:#000}
  #blood-plasma .bp-tile img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:0;transition:opacity 1.6s ease-in-out;will-change:transform,opacity;
  }
  #blood-plasma .bp-tile img.on{opacity:1}
  /* zooms between 92% and 100% only, so the whole photo is always visible */
  @keyframes drift{
    0%  {transform:scale(.82) translate(calc(var(--dx) * -1),calc(var(--dy) * -1))}
    50% {transform:scale(1) translate(0,0)}
    100%{transform:scale(.82) translate(var(--dx),var(--dy))}
  }
  #blood-plasma .bp-tile img{animation:drift var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
  #blood-plasma .credit{
    position:absolute;right:12px;bottom:10px;font-size:12px;letter-spacing:.04em;
    color:rgba(220,230,225,.75);text-shadow:0 1px 3px #000;pointer-events:none
  }
  @media (max-width:700px){
    #blood-plasma .collage{aspect-ratio:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
    #blood-plasma .bp-tile{aspect-ratio:16/9}
    #blood-plasma .bp-tile.t9{display:none}   /* phones: 8 windows, so both columns end evenly */
    #blood-plasma .credit{position:static;grid-column:1/-1;padding:4px 8px 8px;text-align:right}
  }
  </style>
  <div class="collage" id="bp-collage" aria-label="Blood plasma under the microscope, a moving collage by Fiona Gardner">
  <div class="bp-tile t1"></div><div class="bp-tile t2"></div><div class="bp-tile t3"></div>
  <div class="bp-tile t4"></div><div class="bp-tile t5"></div><div class="bp-tile t6"></div>
  <div class="bp-tile t7"></div><div class="bp-tile t8"></div><div class="bp-tile t9"></div>
  <div class="credit">Microscope images © Fiona Gardner · @messagesinplasma</div>
</div>
  <script>

(function(){
  var IMGS = ["assets/gallery/blood-plasma/01.jpg", "assets/gallery/blood-plasma/02.jpg", "assets/gallery/blood-plasma/03.jpg", "assets/gallery/blood-plasma/04.jpg", "assets/gallery/blood-plasma/05.jpg", "assets/gallery/blood-plasma/06.jpg", "assets/gallery/blood-plasma/07.jpg", "assets/gallery/blood-plasma/08.jpg", "assets/gallery/blood-plasma/09.jpg", "assets/gallery/blood-plasma/10.jpg", "assets/gallery/blood-plasma/11.jpg", "assets/gallery/blood-plasma/12.jpg", "assets/gallery/blood-plasma/13.jpg", "assets/gallery/blood-plasma/14.jpg", "assets/gallery/blood-plasma/15.jpg"];
  var tiles = Array.prototype.slice.call(document.querySelectorAll('#bp-collage .bp-tile'));

  // shuffle so the order is different on every visit
  var order = IMGS.map(function(_,i){return i});
  for (var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}

  function makeImg(idx){
    var img = new Image();
    img.src = IMGS[idx];
    img.alt = 'Blood plasma under the microscope';
    img.dataset.idx = idx;
    img.style.setProperty('--dur', (9 + Math.random()*5).toFixed(1)+'s');
    img.style.setProperty('--delay', (-Math.random()*20).toFixed(1)+'s');
    img.style.setProperty('--dx', ((Math.random()*8)-4).toFixed(1)+'%');
    img.style.setProperty('--dy', ((Math.random()*8)-4).toFixed(1)+'%');
    return img;
  }

  var showing = [];
  tiles.forEach(function(tile,k){
    var img = makeImg(order[k]);
    tile.appendChild(img);
    showing[k] = order[k];
    setTimeout(function(){ img.classList.add('on'); }, 150 + k*180);
  });
  var reserve = order.slice(tiles.length);


  var last = -1;
  function swap(){
    var k; do { k = Math.floor(Math.random()*tiles.length); } while (k === last && tiles.length > 1);
    last = k;
    var tile = tiles[k];
    var nextIdx = reserve.shift();
    reserve.push(showing[k]);
    showing[k] = nextIdx;
    var oldImg = tile.querySelector('img.on');
    var img = makeImg(nextIdx);
    tile.appendChild(img);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ img.classList.add('on'); }); });
    if (oldImg) setTimeout(function(){ oldImg.classList.remove('on'); }, 200);
    setTimeout(function(){ if (oldImg && oldImg.parentNode) oldImg.parentNode.removeChild(oldImg); }, 3000);
  }
  setInterval(swap, 2200);
})();
  </script>

  <script>
    // Each set shows its images by itself: one at a time, in random order, a picture rises out of the grid,
    // shows itself whole, and settles back, until every picture in the set has been seen; then a new order.
    // Only the set most in view plays. Tapping a picture shows it next. Without script, tiles open the image.
    (() => {
      const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const HOLD = 2300, MOVE = calm ? 0 : 750, REST = 250;   // about 4 seconds a picture
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
      const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      const shows = [...document.querySelectorAll('.gallery-set .sheet')].map((sheet) => {
        const tiles = [...sheet.querySelectorAll('.tile:not(.tile--story)')];
        const veil = document.createElement('div'); veil.className = 'sheet-veil'; sheet.append(veil);
        const show = { sheet, tiles, bag: [], last: null, ratio: 0, busy: false, next: null };
        tiles.forEach((tile) => tile.addEventListener('click', (e) => { e.preventDefault(); show.next = tile; if (!show.busy) run(show, true); }));
        return show;
      });

      const draw = (show) => {
        if (show.next) { const t = show.next; show.next = null; show.bag = show.bag.filter((x) => x !== t); return t; }
        if (!show.bag.length) { show.bag = shuffle([...show.tiles]); if (show.bag[0] === show.last && show.bag.length > 1) show.bag.push(show.bag.shift()); }
        return show.bag.shift();
      };

      async function present(show, tile) {
        const full = await load(tile.href);
        if (!full) return;
        const box = show.sheet.getBoundingClientRect(), t = tile.getBoundingClientRect();
        const from = { left: t.left - box.left, top: t.top - box.top, width: t.width, height: t.height };
        // The whole picture, as large as fits over the grid (a little margin), centred.
        const room = { w: box.width * 0.96, h: Math.max(box.height * 0.96, Math.min(innerHeight * 0.8, box.width * 0.75)) };
        const k = Math.min(room.w / full.naturalWidth, room.h / full.naturalHeight);
        const w = full.naturalWidth * k, h = full.naturalHeight * k;
        const to = { left: (box.width - w) / 2, top: (box.height - h) / 2, width: w, height: h };
        const img = document.createElement('img');
        img.className = 'sheet-feature'; img.src = full.src; img.alt = tile.querySelector('img').alt;
        Object.assign(img.style, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' });
        show.sheet.append(img);
        tile.classList.add('is-out'); show.sheet.classList.add('is-showing');
        const px = (r) => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
        const opts = { duration: MOVE, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'both' };
        await img.animate(calm ? [{ opacity: 0 }, { opacity: 1 }] : [px(from), px(to)], { ...opts, duration: calm ? 600 : MOVE }).finished;
        if (show.bag[0]) load(show.bag[0].href);   // fetch the next picture while this one shows
        await wait(HOLD);
        show.sheet.classList.remove('is-showing');
        await img.animate(calm ? [{ opacity: 1 }, { opacity: 0 }] : [px(to), px(from)], { ...opts, duration: calm ? 600 : MOVE }).finished;
        tile.classList.remove('is-out'); img.remove();
        show.last = tile;
      }

      async function run(show, once) {
        show.busy = true;
        do {
          await present(show, draw(show));
          if (!once) await wait(REST);
        } while ((!once && playing() === show && !document.hidden) || show.next);
        show.busy = false;
        if (once) start();
      }

      // The set most in view plays; the others wait. People who ask for less motion get no autoplay.
      const playing = () => { const best = shows.reduce((a, b) => (b.ratio > a.ratio ? b : a)); return best.ratio >= 0.3 ? best : null; };
      const start = () => { const p = playing(); if (!calm && p && !p.busy && !document.hidden) run(p, false); };
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { const s = shows.find((x) => x.sheet === e.target); if (s) s.ratio = e.intersectionRatio; });
        start();
      }, { threshold: [0, 0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 1] });
      shows.forEach((s) => io.observe(s.sheet));
      document.addEventListener('visibilitychange', start);
    })();
  </script>
