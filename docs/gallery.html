  <dialog class="viewer" aria-label="Image viewer">
    <img alt="">
    <button class="viewer-close" type="button" aria-label="Close">×</button>
    <button class="viewer-prev" type="button" aria-label="Previous image">‹</button>
    <button class="viewer-next" type="button" aria-label="Next image">›</button>
  </dialog>
  <script>
    // Opens a tile in the viewer and steps through its own set; without script each tile opens the image itself.
    const viewer = document.querySelector('.viewer');
    const shown = viewer.querySelector('img');
    let tiles = [], at = 0;
    const show = (i) => { at = (i + tiles.length) % tiles.length; shown.src = tiles[at].href; shown.alt = tiles[at].querySelector('img').alt; };
    document.querySelectorAll('.sheet .tile:not(.tile--story)').forEach((tile) => {
      tile.addEventListener('click', (event) => {
        event.preventDefault();
        tiles = [...tile.closest('.sheet').querySelectorAll('.tile:not(.tile--story)')];
        show(tiles.indexOf(tile));
        viewer.showModal();
      });
    });
    viewer.querySelector('.viewer-close').addEventListener('click', () => viewer.close());
    viewer.querySelector('.viewer-prev').addEventListener('click', () => show(at - 1));
    viewer.querySelector('.viewer-next').addEventListener('click', () => show(at + 1));
    viewer.addEventListener('click', (event) => { if (event.target === viewer) viewer.close(); });
    viewer.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(at - 1);
      if (event.key === 'ArrowRight') show(at + 1);
    });
  </script>
